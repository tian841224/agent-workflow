name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        node-version: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run ci

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - run: npm pack
      - run: mkdir smoke
      - working-directory: smoke
        run: npm init -y
      - working-directory: smoke
        run: npm install ../tian-agent-workflow-*.tgz
      - working-directory: smoke
        run: npx agent-workflow --help
      - working-directory: smoke
        run: npx agent-workflow contract-lint --root node_modules/@tian/agent-workflow
      - working-directory: smoke
        run: npx agent-workflow policy-matrix --policy-path node_modules/@tian/agent-workflow/schemas/workflow-policy.json
